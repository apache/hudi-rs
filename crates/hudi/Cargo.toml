[package]
name = "hudi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
keywords.workspace = true
readme.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
hudi-core = { version = "0.5.0-rc.2", path = "../core", default-features = false }
hudi-datafusion = { version = "0.5.0-rc.2", path = "../datafusion", optional = true, default-features = false }

[features]
default = ["spill-rocksdb"]
# On by default, so this crate and everything downstream of it keep the merge
# map's on-disk tier unless they say otherwise. Forwarded rather than left to
# hudi-core's own default because a consumer can only opt out of a feature its
# direct dependency exposes: without this, `default-features = false` here would
# still get the tier back through hudi-core. Dropping it removes the tier, and a
# merge exceeding `hoodie.memory.merge.max.size` then fails rather than spilling.
spill-rocksdb = [
    "hudi-core/spill-rocksdb",
    "hudi-datafusion?/spill-rocksdb",
]
datafusion = [
    "hudi-datafusion",
]

[dev-dependencies]
tokio = { workspace = true }

[package]
name = "hudi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
keywords.workspace = true
readme.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[dependencies]
# arrow
arrow = { workspace = true }
arrow-arith = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-cast = { workspace = true }
arrow-ipc = { workspace = true }
arrow-json = { workspace = true }
arrow-ord = { workspace = true }
arrow-row = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true }

# avro
arrow-avro = { workspace = true }
apache-avro = { workspace = true }
apache-avro-derive = { workspace = true }

# serde
serde = { workspace = true }
serde_json = { workspace = true }

# "stdlib"
thiserror = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
roaring = { workspace = true }
foldhash = { workspace = true }
rocksdb = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
log-once = { workspace = true }
num-traits = { workspace = true }
once_cell = { workspace = true }
paste = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
md-5 = { workspace = true }
xxhash-rust = { workspace = true }

# runtime / async
async-recursion = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }

# protobuf
prost = { workspace = true }

# compression
flate2 = { workspace = true }

# lance
# lance-encoding and lance-file generate Rust code from .proto files via
# prost-build at compile time, which shells out to `protoc`. Any build of
# hudi-core (CI, Docker, local dev, downstream consumers) must therefore
# have `protoc` available on PATH — there is no opt-out.
lance-core = { version = "4.0.1" }
lance-encoding = { version = "4.0.1" }
lance-file = { version = "4.0.1" }
lance-io = { version = "4.0.1" }

# datafusion
datafusion = { workspace = true, optional = true }
datafusion-expr = { workspace = true, optional = true }
datafusion-common = { workspace = true, optional = true }
datafusion-physical-expr = { workspace = true, optional = true }
percent-encoding = { workspace = true }

[dev-dependencies]
hudi-test = { path = "../test" }
serial_test = { workspace = true }
# Also a regular dependency, but only an optional one behind `spill-rocksdb`.
# Repeated here because tests outside the spill tier use it too, and must keep
# building in the `--no-default-features` configuration.
tempfile = { workspace = true }

[lints.clippy]
result_large_err = "allow"

[features]
default = ["spill-rocksdb"]

# The merge-on-read merge map's on-disk tier, which it spills to when a file
# group's log records exceed `hoodie.memory.merge.max.size`.
#
# On by default because a read that needs to spill and cannot is a read that
# fails. Off, `rocksdb` is not built at all — it bundles RocksDB and generates
# its bindings with bindgen, so it needs libclang and a C++ toolchain in front of
# every consumer of this crate, the Python wheel and the cxx bridge included.
# Java's own default disk map is BitCask, not RocksDB, so paying for it
# unconditionally is not parity either.
#
# With the feature off, a merge that stays inside its budget is unaffected; one
# that would spill fails with a message naming this feature rather than growing
# unbounded.
spill-rocksdb = ["dep:rocksdb", "dep:tempfile"]

datafusion = [
    "dep:datafusion",
    "datafusion-expr",
    "datafusion-common",
    "datafusion-physical-expr",
]

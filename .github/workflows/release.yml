name: Publish artifacts

on:
  push:
    tags:
      - 'release-[0-9]+.[0-9]+.[0-9]+**'

jobs:
  validate-release-tag:
    name: Validate git tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compare git tag with cargo metadata
        run: |
          CURR_VER=$( grep version Cargo.toml | head -n 1 | awk '{print $3}' | tr -d '"' )
          if [[ "${GITHUB_REF_NAME}" != "release-${CURR_VER}" ]]; then
            echo "Pushed tag ${GITHUB_REF_NAME} does not match with the Cargo package version ${CURR_VER}."
            exit 1
          fi

  # Build every artifact before anything is uploaded. crates.io refuses a second
  # publish of the same version, so a build that fails after a sibling job has
  # already uploaded strands the release on a version that cannot be reused.
  build-mac:
    name: Build wheels on Mac
    needs: validate-release-tag
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-apple-darwin, aarch64-apple-darwin ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          # RocksDB uses C++17 aligned allocation, available on macOS 10.13+,
          # while the x86_64 build otherwise runs at rustc's 10.12 floor and
          # fails to compile. arm64 already floors at 11.0.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'x86_64-apple-darwin' && '10.13' || '11.0' }}
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release -m python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-mac-${{ matrix.target }}
          path: dist

  build-windows:
    name: Build wheels on Windows
    needs: validate-release-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install protobuf compiler
        run: choco install protoc --yes

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-msvc
          command: build
          args: --release -m python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows
          path: dist

  build-manylinux:
    name: Build wheels and sdist on manylinux
    needs: validate-release-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build sdist
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m python/Cargo.toml --out dist

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release -m python/Cargo.toml --out dist
          manylinux: '2014'
          before-script-linux: |
            source .github/scripts/manylinux-build-deps.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-manylinux-${{ matrix.target }}
          path: dist

  publish-pypi:
    name: Publish to PyPI
    needs: [ build-mac, build-windows, build-manylinux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Upload to pypi
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          MATURIN_REPOSITORY: pypi
        with:
          command: upload
          # --non-interactive so a missing token fails here rather than blocking
          # on a credential prompt until the job times out.
          args: --skip-existing --non-interactive dist/*

  publish-crates:
    name: Publish to crates.io
    needs: [ build-mac, build-windows, build-manylinux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # One invocation rather than a crate at a time: cargo packages and
      # verifies all three before uploading any, and works out the order itself,
      # so a failure part-way cannot leave one crate published at a version the
      # workflow can never re-run.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p hudi-core -p hudi-datafusion -p hudi --all-features
